<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis horarios</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <header>
        <h1>Mis horarios</h1>
        <div class="vistas">
            <button id="vistaSemana" class="active">
                Semana
            </button>
            <button id="vistaMes">
                Mes
            </button>
        </div>
    </header>
    <main>
        <div class="barra-superior">
            <button id="mesAnterior">
                ‹
            </button>
            <h2 id="tituloCalendario"></h2>
            <button id="mesSiguiente">
                ›
            </button>
        </div>
        <button
            id="btnAnadirEvento"
            class="boton-añadir">
            + Añadir evento
        </button>
        <p class="instruccion-arrastre">
            Mantén pulsado un evento para moverlo o copiarlo
        </p>
        <div id="calendario"></div>
    </main>
    <!-- MODAL AÑADIR / EDITAR -->
    <div id="modal" class="modal oculto">
        <div class="modal-contenido">
            <h2 id="tituloModal">
                Añadir evento
            </h2>
            <label for="nombreEvento">
                Nombre
            </label>
            <input
                type="text"
                id="nombreEvento"
                placeholder="Ej. Matemáticas"
            >
            <label for="fechaEvento">
                Fecha
            </label>
            <input
                type="date"
                id="fechaEvento"
            >
            <label for="horaInicio">
                Hora de inicio
            </label>
            <input
                type="time"
                id="horaInicio"
            >
            <label for="horaFin">
                Hora de finalización
            </label>
            <input
                type="time"
                id="horaFin"
            >
            <div class="checkbox-todo-dia">
                <input
                    type="checkbox"
                    id="todoElDia"
                >
                <label for="todoElDia">
                    Todo el día
                </label>
            </div>
            <label for="colorEvento">
                Color
            </label>
            <input
                type="color"
                id="colorEvento"
                value="#6366f1"
            >
            <div class="acciones-modal">
                <button
                    id="botonEliminar"
                    style="display: none; background: #dc2626; color: white;">
                    Eliminar
                </button>
                <button id="cancelarEvento">
                    Cancelar
                </button>
                <button
                    id="guardarEvento"
                    class="guardar">
                    Guardar
                </button>
            </div>
        </div>
    </div>
    <!-- MODAL COPIAR / MOVER -->
    <div
        id="modalArrastre"
        class="modal-arrastre oculto">
        <div class="caja-arrastre">
            <h3>
                ¿Qué quieres hacer?
            </h3>
            <p>
                Has arrastrado este evento a otro día.
            </p>
            <div class="botones-arrastre">
                <button
                    id="botonMover"
                    class="boton-mover">
                    Mover
                </button>
                <button
                    id="botonCopiar"
                    class="boton-copiar">
                    Copiar
                </button>
                <button
                    id="botonCancelarArrastre"
                    class="boton-cancelar-arrastre">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
